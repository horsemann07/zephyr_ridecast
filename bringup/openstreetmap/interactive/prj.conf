# Existing STM32H7B3I-DK LCD + FT5336 touch, using LVGL 9.
CONFIG_DISPLAY=y
CONFIG_STM32_LTDC_RGB888=y
CONFIG_INPUT=y
CONFIG_LVGL=y
CONFIG_LV_Z_POINTER_FROM_CHOSEN_TOUCH=y
CONFIG_LV_Z_POINTER_INPUT=y
CONFIG_LV_Z_MEM_POOL_SIZE=16384
CONFIG_LV_USE_IMAGE=y
CONFIG_LV_USE_BUTTON=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
