
# STM32H7B3I-DK LCD and Zephyr LVGL
CONFIG_DISPLAY=y
CONFIG_STM32_LTDC_RGB888=y
CONFIG_INPUT=y
CONFIG_LVGL=y
CONFIG_LV_Z_POINTER_FROM_CHOSEN_TOUCH=y
CONFIG_LV_Z_POINTER_INPUT=y
CONFIG_LV_Z_MEM_POOL_SIZE=16384
CONFIG_LV_USE_LABEL=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_MAIN_STACK_SIZE=4096

# Console
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# Networking
CONFIG_NETWORKING=y
CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_IPV6=n

# STM32 hardware random number generator
CONFIG_ENTROPY_GENERATOR=y
CONFIG_ENTROPY_DEVICE_RANDOM_GENERATOR=y

# Onboard Inventek Wi-Fi
CONFIG_SPI=y
CONFIG_WIFI_ESWIFI=y
CONFIG_WIFI_ESWIFI_BUS_SPI=y


# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MAX_LEVEL=3
CONFIG_LOG_BUFFER_SIZE=4096

# Wi-Fi logging
CONFIG_WIFI_LOG_LEVEL_INF=y
